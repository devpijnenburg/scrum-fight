name: OTAP Pipeline

on:
  push:
    branches: ["**"]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  test:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Lint (frontend modules)
        if: matrix.package == 'frontend'
        run: npm run lint

  build:
    name: Build & Push Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA tag
        id: sha
        run: echo "tag=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker meta (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/scrum-fight-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker meta (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/scrum-fight-frontend
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    name: Deploy to Test
    runs-on: [self-hosted, proxmox]
    needs: build
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 622 murderbot.nl >> ~/.ssh/known_hosts || true

      - name: Copy test compose file to VM
        run: |
          scp -4 -P 622 -i ~/.ssh/deploy_key \
            docker-compose.test.yml \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl:~/scrum-fight/

      - name: Ensure .env.test exists with correct overrides
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          SMTP_SSL_TLS: ${{ vars.SMTP_SSL_TLS }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          CREEM_PRO_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_MONTHLY_PRODUCT_ID }}
          CREEM_PRO_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_YEARLY_PRODUCT_ID }}
          CREEM_PREMIUM_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_PREMIUM_MONTHLY_PRODUCT_ID }}
          CREEM_PREMIUM_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_PREMIUM_YEARLY_PRODUCT_ID }}
        run: |
          ssh -4 -p 622 -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl << 'EOF'
          [ -f ~/scrum-fight/.env.test ] || cp ~/scrum-fight/.env ~/scrum-fight/.env.test
          sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=scrumfight_test/' ~/scrum-fight/.env.test
          grep -q '^FRONTEND_TEST_PORT=' ~/scrum-fight/.env.test \
            && sed -i 's/^FRONTEND_TEST_PORT=.*/FRONTEND_TEST_PORT=8082/' ~/scrum-fight/.env.test \
            || echo 'FRONTEND_TEST_PORT=8082' >> ~/scrum-fight/.env.test
          # Betalingen staan op test standaard aan; daarna beheert de workflow
          # "Betalingen aan/uit" deze regel.
          grep -q '^PAYMENTS_ENABLED=' ~/scrum-fight/.env.test \
            || echo 'PAYMENTS_ENABLED=true' >> ~/scrum-fight/.env.test
          EOF
          {
            esc() { printf '%s' "$1" | sed 's/\$/\$\$/g'; }
            printf 'SMTP_HOST=%s\n'     "$(esc "${SMTP_HOST}")"
            printf 'SMTP_PORT=%s\n'     "$(esc "${SMTP_PORT}")"
            printf 'SMTP_USER=%s\n'     "$(esc "${SMTP_USER}")"
            printf 'SMTP_PASSWORD=%s\n' "$(esc "${SMTP_PASSWORD}")"
            printf 'SMTP_FROM=%s\n'     "$(esc "${SMTP_FROM}")"
            printf 'SMTP_STARTTLS=%s\n' "$(esc "${SMTP_STARTTLS}")"
            printf 'SMTP_SSL_TLS=%s\n'  "$(esc "${SMTP_SSL_TLS}")"
            printf 'CREEM_API_KEY=%s\n'        "$(esc "${CREEM_API_KEY}")"
            printf 'CREEM_WEBHOOK_SECRET=%s\n' "$(esc "${CREEM_WEBHOOK_SECRET}")"
            printf 'CREEM_PRO_MONTHLY_PRODUCT_ID=%s\n'     "$(esc "${CREEM_PRO_MONTHLY_PRODUCT_ID}")"
            printf 'CREEM_PRO_YEARLY_PRODUCT_ID=%s\n'      "$(esc "${CREEM_PRO_YEARLY_PRODUCT_ID}")"
            printf 'CREEM_PREMIUM_MONTHLY_PRODUCT_ID=%s\n' "$(esc "${CREEM_PREMIUM_MONTHLY_PRODUCT_ID}")"
            printf 'CREEM_PREMIUM_YEARLY_PRODUCT_ID=%s\n'  "$(esc "${CREEM_PREMIUM_YEARLY_PRODUCT_ID}")"
          } | ssh -4 -p 622 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@murderbot.nl \
              "cat >> ~/scrum-fight/.env.test && chmod 600 ~/scrum-fight/.env.test"

      - name: Deploy test on VM
        run: |
          ssh -4 -p 622 -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl << 'EOF'
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}" docker compose \
            -p scrum-fight-test \
            -f ~/scrum-fight/docker-compose.test.yml \
            --env-file ~/scrum-fight/.env.test \
            pull
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}" docker compose \
            -p scrum-fight-test \
            -f ~/scrum-fight/docker-compose.test.yml \
            --env-file ~/scrum-fight/.env.test \
            down --remove-orphans
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}" docker compose \
            -p scrum-fight-test \
            -f ~/scrum-fight/docker-compose.test.yml \
            --env-file ~/scrum-fight/.env.test \
            up -d || {
              # Show why the stack did not start (the compose output only says "unhealthy").
              echo "::group::Diagnose: database container"
              docker ps -a --filter name=scrum-fight-test --format 'table {{.Names}}\t{{.Status}}'
              docker logs --tail 40 scrum-fight-test-db 2>&1 || true
              echo "::endgroup::"
              echo "::group::Diagnose: disk"
              df -h / /var/lib/docker 2>/dev/null || df -h
              docker system df
              echo "::endgroup::"
              exit 1
            }
          # Oude images van eerdere deploys opruimen: elke push laat anders twee
          # getagde images achter en de schijf loopt vol. `docker rmi` zonder -f
          # laat images staan die nog door een container gebruikt worden.
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '/scrum-fight-(backend|frontend):' \
            | grep -v ':latest$' \
            | xargs -r -n1 docker rmi >/dev/null 2>&1 || true
          docker image prune -f
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}" docker compose \
            -p scrum-fight-test \
            -f ~/scrum-fight/docker-compose.test.yml \
            --env-file ~/scrum-fight/.env.test \
            ps
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-production:
    name: Deploy to Production
    runs-on: [self-hosted, proxmox]
    needs: [build, deploy-test]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p 622 murderbot.nl >> ~/.ssh/known_hosts || true

      - name: Copy compose file to VM
        run: |
          scp -4 -P 622 -i ~/.ssh/deploy_key \
            docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl:~/scrum-fight/

      - name: Write SMTP and payment vars to .env on VM
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
          SMTP_SSL_TLS: ${{ vars.SMTP_SSL_TLS }}
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
          CREEM_WEBHOOK_SECRET: ${{ secrets.CREEM_WEBHOOK_SECRET }}
          CREEM_PRO_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_MONTHLY_PRODUCT_ID }}
          CREEM_PRO_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_PRO_YEARLY_PRODUCT_ID }}
          CREEM_PREMIUM_MONTHLY_PRODUCT_ID: ${{ secrets.CREEM_PREMIUM_MONTHLY_PRODUCT_ID }}
          CREEM_PREMIUM_YEARLY_PRODUCT_ID: ${{ secrets.CREEM_PREMIUM_YEARLY_PRODUCT_ID }}
        run: |
          {
            esc() { printf '%s' "$1" | sed 's/\$/\$\$/g'; }
            printf 'SMTP_HOST=%s\n'     "$(esc "${SMTP_HOST}")"
            printf 'SMTP_PORT=%s\n'     "$(esc "${SMTP_PORT}")"
            printf 'SMTP_USER=%s\n'     "$(esc "${SMTP_USER}")"
            printf 'SMTP_PASSWORD=%s\n' "$(esc "${SMTP_PASSWORD}")"
            printf 'SMTP_FROM=%s\n'     "$(esc "${SMTP_FROM}")"
            printf 'SMTP_STARTTLS=%s\n' "$(esc "${SMTP_STARTTLS}")"
            printf 'SMTP_SSL_TLS=%s\n'  "$(esc "${SMTP_SSL_TLS}")"
            printf 'CREEM_API_KEY=%s\n'        "$(esc "${CREEM_API_KEY}")"
            printf 'CREEM_WEBHOOK_SECRET=%s\n' "$(esc "${CREEM_WEBHOOK_SECRET}")"
            printf 'CREEM_PRO_MONTHLY_PRODUCT_ID=%s\n'     "$(esc "${CREEM_PRO_MONTHLY_PRODUCT_ID}")"
            printf 'CREEM_PRO_YEARLY_PRODUCT_ID=%s\n'      "$(esc "${CREEM_PRO_YEARLY_PRODUCT_ID}")"
            printf 'CREEM_PREMIUM_MONTHLY_PRODUCT_ID=%s\n' "$(esc "${CREEM_PREMIUM_MONTHLY_PRODUCT_ID}")"
            printf 'CREEM_PREMIUM_YEARLY_PRODUCT_ID=%s\n'  "$(esc "${CREEM_PREMIUM_YEARLY_PRODUCT_ID}")"
          } | ssh -4 -p 622 -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key \
              ${{ secrets.DEPLOY_USER }}@murderbot.nl \
              "cat >> ~/scrum-fight/.env && chmod 600 ~/scrum-fight/.env"

      # Betalingen staan op productie standaard uit; daarna beheert de workflow
      # "Betalingen aan/uit" deze regel.
      - name: Default payments toggle to off when not set yet
        run: |
          ssh -4 -p 622 -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl \
            "grep -q '^PAYMENTS_ENABLED=' ~/scrum-fight/.env || echo 'PAYMENTS_ENABLED=false' >> ~/scrum-fight/.env"

      - name: Deploy production on VM
        run: |
          ssh -4 -p 622 -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@murderbot.nl << 'EOF'
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose \
            -f ~/scrum-fight/docker-compose.prod.yml \
            --env-file ~/scrum-fight/.env \
            pull
          docker compose \
            -f ~/scrum-fight/docker-compose.prod.yml \
            --env-file ~/scrum-fight/.env \
            down --remove-orphans
          docker compose \
            -f ~/scrum-fight/docker-compose.prod.yml \
            --env-file ~/scrum-fight/.env \
            up -d
          docker image prune -f
          docker compose \
            -f ~/scrum-fight/docker-compose.prod.yml \
            --env-file ~/scrum-fight/.env \
            ps
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
