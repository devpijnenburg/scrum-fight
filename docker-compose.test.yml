services:
  db:
    image: postgres:16-alpine
    dns:
      - 172.29.53.53
      - fd53:6d62:6f74::53
    container_name: scrum-fight-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/${GHCR_OWNER}/scrum-fight-backend:${IMAGE_TAG}
    dns:
      - 172.29.53.53
      - fd53:6d62:6f74::53
    container_name: scrum-fight-test-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BASE_URL: ${BASE_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL_TLS: ${SMTP_SSL_TLS:-false}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENTS_MODE: test
      CREEM_API_KEY: ${CREEM_API_KEY:-}
      CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
      CREEM_PRO_MONTHLY_PRODUCT_ID: ${CREEM_PRO_MONTHLY_PRODUCT_ID:-}
      CREEM_PRO_YEARLY_PRODUCT_ID: ${CREEM_PRO_YEARLY_PRODUCT_ID:-}
      CREEM_PREMIUM_MONTHLY_PRODUCT_ID: ${CREEM_PREMIUM_MONTHLY_PRODUCT_ID:-}
      CREEM_PREMIUM_YEARLY_PRODUCT_ID: ${CREEM_PREMIUM_YEARLY_PRODUCT_ID:-}
      # Centrale logging (murderbot-stack). Zonder SEQ_API_KEY staat het uit.
      SEQ_URL: http://seq:5341
      SEQ_API_KEY: ${SEQ_API_KEY:-}
      SEQ_ENVIRONMENT: test
      # debug | info | warn | error (standaard info), zie docs/kamerflows.md
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - default    # database en frontend
      - murderbot  # gedeeld netwerk met Seq

  frontend:
    image: ghcr.io/${GHCR_OWNER}/scrum-fight-frontend:${IMAGE_TAG}
    dns:
      - 172.29.53.53
      - fd53:6d62:6f74::53
    container_name: scrum-fight-test-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_TEST_PORT:-8082}:80"

networks:
  murderbot:
    external: true

volumes:
  postgres_test_data:
