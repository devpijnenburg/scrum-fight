# Assets referenced with a content hash (?v=…, added by scripts/stamp-assets.mjs
# at image build time) never change under the same URL: cache them for a
# year. Anything without a hash (HTML, or unstamped files in local dev) is
# revalidated on every load.
map $arg_v $asset_cache_control {
    ""      "no-cache, must-revalidate";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relatieve redirects (bijv. /nl -> /nl/): achter de HTTPS-proxy blijven
    # schema en host dan die van de bezoeker
    absolute_redirect off;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy Socket.io WebSocket connections — ^~ voorkomt dat de .js regex dit onderschept
    location ^~ /socket.io/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Onbekende URL's geven een echte 404 (geen kopie van de homepage met
    # status 200, die zoekmachines als duplicate content zien)
    error_page 404 /404.html;

    # HTML: nooit cachen zodat browsers altijd de nieuwste versie (met nieuwe hashes) ophalen
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SEO / AI-bestanden: kort cachen, met het juiste content-type
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    # CSS en JS: met ?v=hash een jaar cachen, zonder hash altijd revalideren
    location ~* \.(css|js)$ {
        add_header Cache-Control $asset_cache_control;
    }

    # Static files; /pagina werkt ook zonder .html, /nl → /nl/
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
