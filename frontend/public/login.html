<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inloggen — Scrum Fight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page-auth">

  <site-nav></site-nav>

  <main class="auth-main">
    <div class="auth-card">
      <sf-auth-panel></sf-auth-panel>
    </div>
  </main>

  <site-footer hide-auth></site-footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui/authPanel.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    const panel = document.querySelector('sf-auth-panel');
    if (location.hash === '#register') panel.showTab('register');
    panel.addEventListener('auth-success', () => { window.location.href = '/dashboard.html'; });
  </script>
</body>
</html>
