<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2FA Verificatie — Scrum Fight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="page-auth">

  <nav class="navbar">
    <a href="/" class="navbar-brand">⚔️ Scrum Fight <small class="navbar-subtitle">Story Estimator 2.0</small></a>
  </nav>

  <main class="auth-main">
    <div class="auth-card">
      <h2 class="auth-title" data-i18n="login.totp.title">Twee-factor verificatie</h2>
      <sf-auth-panel step="totp"></sf-auth-panel>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // The pre-auth token from the OAuth callback; set before the panel upgrades.
    const preAuthToken = new URLSearchParams(location.search).get('preAuthToken');
    if (!preAuthToken) window.location.href = '/login.html';
    document.querySelector('sf-auth-panel').setAttribute('pre-auth-token', preAuthToken || '');
  </script>
  <script src="/js/ui/authPanel.js"></script>
  <script>
    document.querySelector('sf-auth-panel')
      .addEventListener('auth-success', () => { window.location.href = '/dashboard.html'; });
  </script>
</body>
</html>
